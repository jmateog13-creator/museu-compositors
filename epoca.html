<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sala · 3r</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Oswald:wght@700&family=Uncial+Antiqua&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@700&family=Cinzel:wght@700&family=Abril+Fatface&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skin.css">
<style>
  body { display:flex; flex-direction:column; position:relative; }
  .cap { flex:none; text-align:center; padding-top:1.5dvh; }
  h1 { font-weight:700; font-size:clamp(26px,min(11dvh,11vw),100px); line-height:1; margin:0; }
  .cap small { font:700 clamp(13px,2.3dvh,20px) "Archivo Narrow", sans-serif; }
  .grup { flex:1; min-height:0; width:100%; max-width:1200px; margin:0 auto; padding:1dvh 16px 2dvh; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:clamp(8px,3vw,40px); }
  .q { min-height:0; display:flex; flex-direction:column; align-items:center; text-align:center; text-decoration:none; color:inherit; transition:transform .15s; }
  .q:hover, .q:focus-visible { transform:translateY(-5px) rotate(-.6deg); }
  .q img { flex:1; min-height:0; width:100%; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(50,30,5,.4)); }
  .q b { font-weight:700; font-size:clamp(15px,min(4.2dvh,6vw),38px); line-height:1.05; margin-top:.3em; }
  .q small { font:700 clamp(12px,2.1dvh,18px) "Archivo Narrow", sans-serif; }
  @media (max-aspect-ratio: 3/4) { .cap { padding-top:5.5dvh; } .grup { grid-template-columns:minmax(0,1fr); grid-template-rows:repeat(3, minmax(0,1fr)); } }
</style>
</head>
<body>
<a class="tornar" href="index.html">← Sales</a>
<header class="cap"><h1 id="titol" class="nom-epoca"></h1><small id="anys" class="nom-epoca"></small></header>
<div class="grup" id="grup"></div>
<script src="dades.js"></script>
<script>
const e = new URLSearchParams(location.search).get("e") in EPOQUES ? new URLSearchParams(location.search).get("e") : "Barroc";
const lletra = `${LLETRES[e]}, 'Archivo Black', serif`, $ = s => document.getElementById(s);
document.documentElement.style.setProperty("--epoca", EPOQUES[e]);
document.title = `${e} · 3r`;
document.body.style.background = `linear-gradient(#fbf7ee77, #fbf7eebb), url("${fons(e)}") center bottom/cover`;
$("titol").textContent = e; $("titol").style.fontFamily = lletra; $("anys").textContent = ANYS[e];
$("grup").innerHTML = Object.entries(COMPOSITORS).filter(([, c]) => c.epoca === e).map(([id, c]) => `
  <a class="q" href="compositor.html?c=${id}"><img src="art/museu-${id}.png" alt="Retrat de ${c.nom}">
    <b class="nom-epoca" style="font-family:${lletra}">${c.nom}</b><small class="nom-epoca">${c.dates}</small></a>`).join("");
</script>
</body>
</html>
