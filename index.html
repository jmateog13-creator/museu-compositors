<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Museu dels compositors · 3r</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo+Narrow:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&family=Oswald:wght@700&family=Uncial+Antiqua&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@700&family=Cinzel:wght@700&family=Abril+Fatface&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skin.css">
<style>
  body { display:flex; flex-direction:column; background:linear-gradient(#fbf7eeaa, #fbf7eedd), url("img/fons/passadis.jpg") center bottom/cover; }
  h1 { flex:none; font:400 clamp(20px,min(7vh,8vw),60px)/1 "Archivo Black", sans-serif; text-transform:uppercase; text-align:center; margin:1.5vh 0 0; }
  .sub { flex:none; text-align:center; font:700 clamp(15px,2.6vh,24px) Kalam, cursive; margin-bottom:1vh; }
  .sales { flex:1; min-height:0; width:100%; max-width:1200px; margin:0 auto; padding:0 16px 1.5vh; display:grid; gap:1.5vh clamp(10px,2.5vw,32px);
           grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); }
  .s { min-height:0; display:flex; flex-direction:column; align-items:center; text-decoration:none; color:inherit; transition:transform .15s; }
  .s:hover, .s:focus-visible { transform:translateY(-4px) rotate(-.6deg); }
  .llenc { flex:1; min-height:0; width:100%; border:clamp(5px,1vh,10px) solid #c9a227; box-shadow:0 8px 14px #0004; background:var(--f) center/cover;
           display:flex; align-items:center; justify-content:center; gap:1%; padding:1.2vh 2%; }
  .llenc img { min-width:0; flex:1 1 0; height:100%; object-fit:contain; filter:drop-shadow(0 3px 4px #0005); }
  .s b { font-weight:700; font-size:clamp(14px,min(3.6vh,5.6vw),32px); line-height:1.1; margin-top:.25em; }
  .s small { font:700 clamp(11px,1.8vh,15px) "Archivo Narrow", sans-serif; }
  @media (max-aspect-ratio: 3/4) { .sales { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(3, minmax(0,1fr)); } }
</style>
</head>
<body>
<h1>Museu dels compositors</h1>
<p class="sub">Tria una sala i escolta.</p>
<div class="sales" id="sales"></div>
<script src="dades.js"></script>
<script>
document.getElementById("sales").innerHTML = Object.keys(EPOQUES).map(e => `
  <a class="s" href="epoca.html?e=${encodeURIComponent(e)}">
    <div class="llenc" style="--f:url('${fons(e)}')">${Object.keys(COMPOSITORS).filter(id => COMPOSITORS[id].epoca === e).map(id => `<img src="art/museu-${id}.png" alt="">`).join("")}</div>
    <b class="nom-epoca" style="font-family:${LLETRES[e]}, 'Archivo Black', serif">${e}</b><small>${ANYS[e]}</small>
  </a>`).join("");
</script>
</body>
</html>
